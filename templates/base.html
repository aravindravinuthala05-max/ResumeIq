<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ResumeIQ{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dark-mode {% block body_class %}{% endblock %}">
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <span>ResumeIQ</span>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('features') }}">Features</a>
                <a href="{{ url_for('how_it_works') }}">How It Works</a>
                <button class="nav-icon-button" id="themeToggle" type="button" aria-label="Switch to light mode" aria-pressed="true">
                    <i class="fas fa-sun" aria-hidden="true"></i>
                </button>
                <button class="nav-icon-button nav-about-button" id="aboutToggle" type="button" aria-label="About ResumeIQ">
                    <i class="fas fa-circle-info" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 ResumeIQ - AI Resume Intelligence Platform</p>
    </footer>

    <div class="about-modal" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutModalTitle" hidden>
        <div class="about-modal-backdrop" data-close-about></div>
        <section class="about-modal-card">
            <button class="about-close" type="button" aria-label="Close About dialog" data-close-about><i class="fas fa-xmark"></i></button>
            <div class="about-modal-icon"><i class="fas fa-brain"></i></div>
            <p class="about-modal-kicker">ResumeIQ</p>
            <h2 id="aboutModalTitle">AI Resume Intelligence Platform</h2>
            <p>Version 1.0</p>
            <p class="about-developer">Developed by Aravind Ravinuthala</p>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
